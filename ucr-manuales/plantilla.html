<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Documentos · Portal de Valoración UCR</title>
<style>
  :root { --tinta:#1d2733; --suave:#5b6773; --linea:#d9dee3; --fondo:#f6f7f8; --acento:#1f5fa8; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--tinta); background:var(--fondo); }
  header { background:#fff; border-bottom:1px solid var(--linea); padding:14px 24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; font-weight:650; }
  header .sub { color:var(--suave); font-size:13px; }
  header .der { margin-left:auto; display:flex; gap:8px; }
  main { max-width:1100px; margin:0 auto; padding:24px; }
  .caja { background:#fff; border:1px solid var(--linea); border-radius:8px; padding:20px; }
  #acceso { max-width:380px; margin:60px auto; }
  #acceso label { display:block; font-weight:600; margin-bottom:8px; }
  input[type=password] { width:100%; padding:10px 12px; font-size:15px; border:1px solid var(--linea); border-radius:6px; }
  button, a.btn { font:inherit; font-size:14px; padding:8px 14px; border-radius:6px; border:1px solid var(--linea); background:#fff; color:var(--tinta); cursor:pointer; text-decoration:none; display:inline-block; }
  button.prim, a.prim { background:var(--acento); border-color:var(--acento); color:#fff; }
  #acceso button { margin-top:12px; width:100%; }
  #error { color:#b3261e; font-size:13px; min-height:20px; margin-top:8px; }
  .lista { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; }
  .seccion { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--suave); margin:22px 0 10px; font-weight:650; }
  .seccion:first-child { margin-top:0; }
  .lista h2 { font-size:16px; margin:0 0 4px; }
  .lista p { margin:0 0 14px; color:var(--suave); font-size:13.5px; }
  .lista .acc { display:flex; gap:8px; }
  #visor { margin-top:20px; }
  #visor iframe { width:100%; height:80vh; border:1px solid var(--linea); border-radius:8px; background:#fff; }
  footer { color:var(--suave); font-size:12px; text-align:center; padding:24px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <div><h1>Documentos · Portal de Valoración UCR</h1><div class="sub">Unidad de Control del Rendimiento · CAR de Madrid</div></div>
  <div class="der"><a class="btn" id="ir-ucr" hidden target="_blank" rel="noopener">Abrir la herramienta UCR</a><button id="salir" hidden>Salir</button></div>
</header>
<main>
  <form class="caja" id="acceso" autocomplete="off">
    <label for="pwd">Contraseña</label>
    <input type="password" id="pwd" autofocus>
    <button class="prim" type="submit" id="entrar">Entrar</button>
    <div id="error"></div>
  </form>
  <section id="panel" hidden>
    <div id="secciones"></div>
    <div id="visor" hidden><iframe id="marco" title="Documento"></iframe></div>
  </section>
</main>
<footer>© 2026 Óscar Plana Cases. Todos los derechos reservados. <span id="fecha"></span></footer>
<script>
const DATOS = /*DATOS*/null;
const de64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const docs = [];
document.getElementById("fecha").textContent = "Versión del " + DATOS.fecha + ".";

fetch("config.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(c => {
  if (c && c.conexion_ucr === true && c.url_herramienta) { const a = document.getElementById("ir-ucr"); a.href = c.url_herramienta; a.hidden = false; }
}).catch(() => {});

async function abrir(pwd) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pwd), "PBKDF2", false, ["deriveKey"]);
  for (const ll of DATOS.llaves) {
    const k = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: de64(ll.sal), iterations: DATOS.iter }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    try { return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: de64(ll.iv) }, k, de64(ll.ct))); } catch (e) {}
  }
  return null;
}
async function paquete(bytesClave, bloque) {
  const k = await crypto.subtle.importKey("raw", bytesClave, "AES-GCM", false, ["decrypt"]);
  const b = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: de64(bloque.iv) }, k, de64(bloque.ct)));
  const n = new DataView(b.buffer).getUint32(0);
  const meta = JSON.parse(new TextDecoder().decode(b.slice(4, 4 + n)));
  const cuerpo = b.slice(4 + n);
  for (const m of meta) docs.push({ ...m, url: URL.createObjectURL(new Blob([cuerpo.slice(m.ini, m.fin)], { type: "application/pdf" })) });
}
function pintar() {
  const cont = document.getElementById("secciones"); cont.textContent = "";
  const orden = [...new Set(docs.map(d => d.seccion))];
  for (const sec of orden) {
    const h = document.createElement("div"); h.className = "seccion"; h.textContent = sec; cont.appendChild(h);
    const lista = document.createElement("div"); lista.className = "lista"; cont.appendChild(lista);
    docs.forEach((d, i) => { if (d.seccion !== sec) return;
      const c = document.createElement("div"); c.className = "caja";
      const t = document.createElement("h2"); t.textContent = d.titulo;
      const p = document.createElement("p"); p.textContent = d.desc;
      const acc = document.createElement("div"); acc.className = "acc";
      const ver = document.createElement("button"); ver.className = "prim"; ver.textContent = "Ver"; ver.dataset.ver = i;
      const baj = document.createElement("a"); baj.className = "btn"; baj.textContent = "Descargar PDF"; baj.href = d.url; baj.download = d.nombre;
      acc.append(ver, baj); c.append(t, p, acc); lista.appendChild(c); });
  }
}
document.getElementById("acceso").addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("error"), btn = document.getElementById("entrar");
  err.textContent = ""; btn.disabled = true; btn.textContent = "Abriendo…";
  const llaves = await abrir(document.getElementById("pwd").value);
  document.getElementById("pwd").value = "";
  btn.disabled = false; btn.textContent = "Entrar";
  if (!llaves) { err.textContent = "Contraseña incorrecta."; return; }
  docs.length = 0;
  await paquete(llaves.slice(0, 32), DATOS.lectura);
  if (llaves.length >= 64) await paquete(llaves.slice(32, 64), DATOS.admin);
  docs.sort((x, y) => x.orden - y.orden);
  pintar();
  document.getElementById("acceso").hidden = true; document.getElementById("panel").hidden = false; document.getElementById("salir").hidden = false;
});
document.addEventListener("click", e => {
  const k = e.target.dataset && e.target.dataset.ver;
  if (k !== undefined && docs[k]) { document.getElementById("marco").src = docs[k].url; document.getElementById("visor").hidden = false; document.getElementById("visor").scrollIntoView({ behavior: "smooth" }); }
  if (e.target.id === "salir") location.reload();
});
</script>
</body>
</html>
