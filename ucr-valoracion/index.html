<script>
(() => {
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js", {updateViaCache: "none"}).catch(() => {});
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); window.__ucrInstalar = e; });
  const D = JSON.parse(document.getElementById("d").textContent);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const aB64 = u => { let s = ""; u.forEach(x => s += String.fromCharCode(x)); return btoa(s); };
  const m = document.getElementById("m"), b = document.getElementById("b");
  async function abrir(raw, rol){
    const k = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    const z = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(D.iv)}, k, b64(D.datos));
    const html = await new Response(new Blob([z]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    const pre = "<script>window.UCR_ROL=" + JSON.stringify(rol) + ";<\/script>";
    document.open(); document.write(html.replace(/<head>/i, "<head>" + pre)); document.close();
  }
  async function probar(pwd){
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pwd), "PBKDF2", false, ["deriveKey"]);
    for (const s of D.llaves){
      const kek = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(s.sal), iterations: D.iteraciones, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
      try { return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(s.iv)}, kek, b64(s.dato)))); } catch (e) {}
    }
    return null;
  }
  try { const ses = JSON.parse(sessionStorage.getItem("ucr-sesion") || "null"); if (ses && ses.v === D.version){ abrir(b64(ses.k), ses.rol).catch(() => sessionStorage.removeItem("ucr-sesion")); return; } } catch (e) {}
  if (!window.crypto || !crypto.subtle || !window.DecompressionStream){ m.className = "err"; m.textContent = "Este navegador no puede abrir la herramienta. Usa Chrome, Edge, Safari o Firefox actualizados."; b.disabled = true; return; }
  document.getElementById("f").addEventListener("submit", async e => {
    e.preventDefault(); b.disabled = true; m.className = ""; m.textContent = "Comprobando…";
    try {
      const r = await probar(document.getElementById("p").value);
      if (!r){ m.className = "err"; m.textContent = "Contraseña incorrecta."; b.disabled = false; return; }
      try { sessionStorage.setItem("ucr-sesion", JSON.stringify({v: D.version, k: r.k, rol: r.rol})); } catch (x) {}
      m.textContent = "Abriendo…"; await abrir(b64(r.k), r.rol);
    } catch (x) { m.className = "err"; m.textContent = "No se pudo abrir: " + (x.message || x); b.disabled = false; }
  });
})();
</script>
